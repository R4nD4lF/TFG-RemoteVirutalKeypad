#Use docker compose 1.6 or greather.
#https://docs.docker.com/compose/install/
version: '3'

services:

  postgres:
    image: postgres:11
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_MULTIPLE_DATABASES="virtualkeypad"
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=mysecretpassword
    volumes:
      - ./config/initdb/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  virtualkeypad:
    build:
      context: ../virtualkeypad/
      dockerfile: Dockerfile
    container_name: virtualkeypad 
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/virtualkeypad
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mysecretpassword
    ports:
      - "8080:8080"

  websocketserver:
    build:
      context: ../websocketserver/
      dockerfile: Dockerfile
    container_name: websocketserver
    restart: always
    ports:
      - "8081:8081"

  recreapad:
    build:
      context: ../recreapad/
      dockerfile: Dockerfile
    restart: always
    container_name: recreapad 
    ports:
      - "80:80"

volumes:
  postgres_data:
